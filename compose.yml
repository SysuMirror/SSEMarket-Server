services:
  # sse_market_client_pc:
  #   image: sse_market_client-pc:latest
  #   build: ../SSE_market_client
  #   ports:
  #     - 80:80
  #   environment:
  #     - TZ=Asia/Shanghai
  temp_blog:
    image: temp_blog:latest
    build: ../VueBlogger
    ports:
      - 80:80
    environment:
      - TZ=Asia/Shanghai
  sse_market_client_mobile:
    image: sse_market_client-mobile:latest
    build: ../sse_market_mobile
    ports:
      - 81:81
    environment:
      - TZ=Asia/Shanghai
  sse_market_manager:
    image: sse_market_manager:latest
    build: ../sse_market_manager
    ports:
      - 82:82
    environment:
      - TZ=Asia/Shanghai
  mysql:
    image: mysql:latest
    ports:
      - 3506:3306
    environment:
      - MYSQL_ROOT_PASSWORD=admin
      - TZ=Asia/Shanghai
      - MYSQL_DATABASE=ssemarket
  redis:
    image: redis:latest
    environment:
      - TZ=Asia/Shanghai
  sse_market_server:
    image: sse_market_server:latest
    build: .
    ports:
      - 8080:8080
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - /root/SSE_Market/sse_market_server_resource:/app/public
