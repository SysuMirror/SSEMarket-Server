  mysql:
    image: mysql:8.1
    container_name: sse_market_db
    restart: always
    command: --max_connections=1000 --default-authentication-plugin=mysql_native_password --innodb_lock_wait_timeout=500
    ports:
      - 3506:3306
    environment:
      - MYSQL_ROOT_PASSWORD=admin
      - TZ=Asia/Shanghai
      - MYSQL_DATABASE=ssemarket
    volumes:
      - my-vol:/var/lib/mysql
  # AOF：降低重启丢 post:browse:count:* 导致与 MySQL 分叉的风险；生产仍需关注 maxmemory 与备份策略。
  redis:
    image: redis:latest
    restart: always
    command: redis-server --appendonly yes
    environment:
      - TZ=Asia/Shanghai
  sse_market_server:
    image: sse_market_server:latest
    container_name: server
    restart: unless-stopped
    # build: ../SSE_market_server_old
    depends_on:
      - redis
      - mysql
    build: .
    # 仅内网访问，对外统一走 nginx HTTPS
    expose:
      - "8080"
    environment:
      - TZ=Asia/Shanghai
      - GIN_MODE=release
      - DATASOURCE_PASSWORD=admin
      - REDIS_PASSWORD=123456
      - JWT_KEY=qeYc&*s18lP+3Ga%w^I59Paq3jx3&o!X
      - COS_APPID=1320172928
      - COS_SECRET_ID=AKID0yDPbghgaRG3lMF9zoP1gKtMrNq561qi
      - COS_SECRET_KEY=6GTZYODxYG3wlbo1KezDKH6ulSxJi3GR
      - OBSERVABILITY_TRACING_ENABLED=true
      - OBSERVABILITY_JAEGER_ENDPOINT=jaeger:4317
    volumes:
      - /root/SSE_Market/sse_market_server_resource:/app/public
      - /root/SSE_Market/log/server:/app/log
      - /root/SSE_Market/database:/app/database
  # 压测栈（SSE_market_server_test）：独立 MySQL/Redis/Go，不影响生产
  # 默认不启动；需要压测时: docker compose --profile loadtest up -d
  mysql_loadtest:
    profiles:
      - loadtest
    image: mysql:8.1
    container_name: sse_market_db_loadtest
    restart: unless-stopped
    command: --max_connections=500 --default-authentication-plugin=mysql_native_password --innodb_lock_wait_timeout=500
    ports:
      - "3507:3306"
    environment:
      MYSQL_ROOT_PASSWORD: admin
      TZ: Asia/Shanghai
      MYSQL_DATABASE: ssemarket_loadtest
    volumes:
      - loadtest-mysql-vol:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-padmin" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis_loadtest:
    profiles:
      - loadtest
    image: redis:latest
    container_name: sse_market_redis_loadtest
    restart: unless-stopped
    ports:
      - "6380:6379"
    command: redis-server --appendonly yes
    environment:
      TZ: Asia/Shanghai
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

  sse_market_server_loadtest:
    profiles:
      - loadtest
    image: sse_market_server_loadtest:latest
    container_name: server_loadtest
    restart: unless-stopped
    build: .
    depends_on:
      mysql_loadtest:
        condition: service_healthy
      redis_loadtest:
        condition: service_healthy
    ports:
      - "8888:8080"
    expose:
      - "8080"
    environment:
      TZ: Asia/Shanghai
      GIN_MODE: release
      LOADTEST_MODE: "true"
      DATASOURCE_HOST: mysql_loadtest
      DATASOURCE_DATABASE: ssemarket_loadtest
      DATASOURCE_PASSWORD: admin
      DATASOURCE_POOL_MAX_OPEN: "250"
      DATASOURCE_POOL_MAX_IDLE: "50"
      REDIS_HOST: redis_loadtest
      REDIS_PASSWORD: ""
      REDIS_POOL_SIZE: "200"
      REDIS_POOL_MIN_IDLE: "20"
      JWT_KEY: qeYc&*s18lP+3Ga%w^I59Paq3jx3&o!X
      OBSERVABILITY_TRACING_ENABLED: "false"
      OBSERVABILITY_TRACING_SERVICE_NAME: sse_market_server_loadtest
      PPROF_ENABLED: "true"
      # 远程抓 profile 时填入压测机公网 IP，例: 112.193.214.228
      # PPROF_IP_WHITELIST: ""
    volumes:
      - /root/SSE_Market/log/server_loadtest:/app/log
      - /root/SSE_Market/log/server_loadtest/pprof:/app/pprof

  prometheus:
    profiles:
      - loadtest
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ../monitor/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --query.timeout=2m
      - --web.enable-lifecycle
    depends_on:
      - sse_market_server_loadtest
  grafana:
    profiles:
      - loadtest
    image: grafana/grafana:11.4.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - 9090:3000
    environment:
      - TZ=Asia/Shanghai
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=SSE_Matket
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://ssemarket.cn/monitor
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - grafana-data:/var/lib/grafana
      - ../monitor/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
  jaeger:
    image: jaegertracing/all-in-one:1.64.0
    container_name: jaeger
    restart: unless-stopped
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - QUERY_BASE_PATH=/jaeger
    depends_on:
      - sse_market_server
  # - /root/SSE_Market/Nginx:/app/ssl
  # sse_market_server_public:
  #   image: sse_market_server_public:latest
