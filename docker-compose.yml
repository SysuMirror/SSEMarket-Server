services:
  SSE_market_client-pc:
    image: client-pc:latest
    build: ../SSE_market_client
    ports:
      - 80:80
  SSE_market_client-mobile:
    image: client-mobile:latest
    build: ../sse_market_mobile
    ports:
      - 81:81
  SSE_market_manager:
    image: manager:latest
    build: ../sse_market_manager
    ports:
      - 82:82
  mysql:
    image: mysql:latest
    ports:
      - 3306:3306
    environment:
      - MYSQL_ROOT_PASSWORD=admin
  redis:
    image: redis:latest
  SSE_market_server:
    image: SSE_market_server:latest
    build: .
    ports:
      - 8080:8080
